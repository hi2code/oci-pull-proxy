name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go stable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test with race detection
        run: go test -race -count=1 -timeout=5m ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build container
        run: docker build --pull --build-arg VERSION="${GITHUB_SHA}" -t oci-pull-proxy:verification .
      - name: Smoke test container
        run: python3 scripts/container-smoke.py oci-pull-proxy:verification

  publish:
    name: Publish GHCR
    needs: [go, container]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-platform image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          image="${IMAGE,,}"
          version="$GITHUB_SHA"
          tag=latest
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Version tag must be vMAJOR.MINOR.PATCH with an optional prerelease suffix"
              exit 1
            fi
            tag="$version"
          fi
          docker buildx build --pull \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$version" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$version" \
            --tag "$image:$tag" \
            --tag "$image:sha-$GITHUB_SHA" \
            --push .
          docker buildx imagetools inspect "$image:$tag"
          docker run --rm --pull always "$image:sha-$GITHUB_SHA" version
          {
            echo "Published \`$image:$tag\` for linux/amd64 and linux/arm64."
            echo ""
            echo "On the first publication, set the GHCR package visibility to Public to allow anonymous pulls."
          } >> "$GITHUB_STEP_SUMMARY"
