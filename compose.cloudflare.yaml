services:
  oci-pull-proxy:
    image: ghcr.io/hi2code/oci-pull-proxy:latest
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "80:8080"
    env_file: .env
    environment:
      TLS_MODE: cloudflare
    volumes:
      - type: bind
        source: ./.mirror-token
        target: /config/.mirror-token
        bind:
          create_host_path: false
      - image-cache:/data/cache
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  image-cache:
