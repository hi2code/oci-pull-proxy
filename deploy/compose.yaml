services:
  oci-pull-proxy:
    image: ghcr.io/hi2code/oci-pull-proxy:latest
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "80:8080"
      - "443:8443"
    env_file: .env
    volumes:
      - image-cache:/data/cache
      - acme-state:/data/acme
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  image-cache:
  acme-state:
